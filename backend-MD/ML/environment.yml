# Ambiente conda do ML do backend-MD
#
# Criar:      conda env create -f ML/environment.yml
# Ativar:     conda activate pi6-backend-md-ml
# Atualizar:  conda env update -f ML/environment.yml --prune

name: pi6-backend-md-ml

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.9

  # Treino e inferência
  - scikit-learn=1.6.1
  - pandas=2.3.3
  - numpy=2.0.2
  - joblib=1.5.2

  # Gráficos (desenvolvimento)
  - matplotlib=3.9.2
  - seaborn=0.13.2

  # Notebooks (desenvolvimento)
  - jupyter
  - ipykernel
