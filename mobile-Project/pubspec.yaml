name: pae_mobile
description: "Aplicativo Flutter da Plataforma de Acompanhamento Educacional (PI 6 - Fatec Franca)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  # Traducao dos widgets do proprio Flutter (seletor de data, acessibilidade)
  # para pt-BR, en-US e es-ES.
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Gerenciamento de estado (decisao registrada na secao 4 do .IA/CONTEXT.md).
  provider: ^6.1.5+1

  # Navegacao declarativa; as rotas espelham as do frontend-Project.
  go_router: ^17.5.0

  # Cliente HTTP: unica forma de acesso a dados, sempre via backend-Project.
  http: ^1.6.0

  # Persistencia local nao sensivel (tema e idioma).
  shared_preferences: ^2.5.5

  # Persistencia local do token de sessao (JWT) - nunca em SharedPreferences.
  flutter_secure_storage: ^9.2.4

  # Formatacao de numero, percentual e data por locale (equivalente ao Intl da Web).
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    # Copias fieis de frontend-Project/src/locales - mesmas chaves, mesmos textos.
    - assets/locales/
    - assets/brand/

flutter_launcher_icons:
  image_path: branding/app_icon.png
  android: true
  adaptive_icon_background: "#070b15"
  adaptive_icon_foreground: branding/app_icon_foreground.png
  adaptive_icon_monochrome: branding/app_icon_foreground.png
  ios: true
  remove_alpha_ios: true
  windows:
    generate: true
    image_path: branding/app_icon.png
    icon_size: 256

flutter_native_splash:
  color: "#070b15"
  image: branding/splash_logo.png
  android_12:
    color: "#070b15"
    image: branding/splash_android12.png
    icon_background_color: "#070b15"
  web: false
