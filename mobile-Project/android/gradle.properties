# O padrao gerado pelo Flutter pede 8 GB de heap e 4 GB de metaspace, o que faz o
# daemon do Gradle morrer por falta de memoria em maquinas com 8-16 GB de RAM
# (JVM crash "insufficient memory ... G1 virtual space"). Estes valores compilam
# o projeto com folga e cabem em um notebook comum.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=320m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
